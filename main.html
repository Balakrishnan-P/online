<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Finder</title>
  <style>
    :root {
      --base-font-size: 16px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }

    .container {
      max-width: 84.375rem; /* 1350px */
      margin: 0 auto;
      padding: 0.4375rem; /* 7px */
    }

    .course-section {
      background-color: rgb(240, 164, 236);
      border-radius: 0.5rem; /* 8px */
      padding: 1.25rem; /* 20px */
      margin: 1.25rem 0; /* 20px */
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .text-section {
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      min-width: 15rem; /* 240px */
    }

    .text-section small {
      font-size: 0.875rem; /* 14px */
      letter-spacing: 0.0625rem; /* 1px */
      text-transform: uppercase;
      font-weight: bold;
    }

    .text-section h3 {
      font-size: 1.5rem; /* 24px */
      font-weight: bold;
      margin-bottom: 0.9375rem; /* 15px */
    }

    .get-started-btn {
      padding: 0.625rem 1.25rem; /* 10px 20px */
      font-size: 1rem; /* 16px */
      background-color: #222;
      color: #fff;
      border: none;
      border-radius: 0.25rem; /* 4px */
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin: 0.625rem auto; /* 10px */
    }

    .get-started-btn:hover {
      background-color: #333;
    }

    .image-section img {
      width: 100%;
      max-width: 6.25rem; /* 100px */
      height: auto;
      object-fit: contain;
    }

    .logos-section {
      text-align: center;
      padding: 1.25rem 0; /* 20px */
    }

    .logos-section h3 {
      margin-bottom: 1.25rem; /* 20px */
      font-size: 1.5rem; /* 24px */
      font-weight: bold;
    }

    .logos-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem; /* 20px */
      flex-wrap: wrap;
    }

    .logos-img {
      max-width: 6.25rem; /* 100px */
      height: auto;
      object-fit: contain;
    }

    /* Media Queries */
    @media (max-width: 64rem) { /* 1024px */
      .course-section {
        flex-direction: column;
        text-align: center;
      }

      .text-section {
        margin-top: 1.25rem; /* 20px */
        padding-top: 0.625rem; /* 10px */
      }

      .text-section h3 {
        font-size: 1.25rem; /* 20px */
      }

      .text-section small {
        font-size: 0.75rem; /* 12px */
      }

      .get-started-btn {
        padding: 0.5rem 1rem; /* 8px 16px */
        font-size: 0.875rem; /* 14px */
      }

      .image-section img {
        max-width: 5rem; /* 80px */
      }
    }

    @media (max-width: 48rem) { /* 768px */
      .course-section {
        padding: 0.9375rem; /* 15px */
      }

      .text-section h3 {
        font-size: 1rem; /* 16px */
      }

      .text-section small {
        font-size: 0.6875rem; /* 11px */
        margin-top: 0.625rem; /* 10px */
      }

      .get-started-btn {
        padding: 0.4375rem 0.875rem; /* 7px 14px */
        font-size: 0.8125rem; /* 13px */
      }

      .image-section img {
        max-width: 4rem; /* 64px */
      }

      .logos-section h3 {
        font-size: 1.25rem; /* 20px */
      }

      .logos-img {
        max-width: 5rem; /* 80px */
      }
    }

    @media (max-width: 36rem) { /* 576px */
      .course-section {
        padding: 0.625rem; /* 10px */
        
      }

      .text-section h3 {
        font-size: 0.875rem; /* 14px */
        margin-right: -4rem;
        
      }

      .text-section small {
        font-size: 0.625rem; /* 10 Redacted */
        margin-right: -4.5rem; /* 8px */
        margin-top: -2rem;
      }

      .get-started-btn {
        padding: 0.375rem 0.75rem; /* 6px 12px */
        font-size: 0.75rem; /* 12px */
        margin-right: -10px;
        
      }

      .image-section img {
        max-width: 28.75rem; /* 60px */
        margin-left: -13rem;
        margin-bottom: -7.20rem;
        margin-top: -2rem;
      }

      .logos-section {
        padding: 0.9375rem 0; /* 15px */
      }

      .logos-img {
        max-width: 4.375rem; /* 70px */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="course-section">
      <div class="image-section">
        <img src="img/lovepik.png" alt="Student" />
      </div>
      <div class="text-section">
        <small>LET US HELP</small>
        <h3>Find Your Perfect Course</h3>
        <button class="get-started-btn">Let's Get Started</button>
      </div>
    </section>
  </div>

  <section class="logos-section">
    <div class="container">
      <h3>DLK is an Authorized Training and Certification Partner for:</h3>
      <div class="logos-container">
        <img src="img/1.png" alt="Company Logo 1" class="logos-img" />
        <img src="img/3.png" alt="Meta" class="logos-img" />
        <img src="img/4.png" alt="Cisco" class="logos-img" />
        <img src="img/2.png" alt="Adobe" class="logos-img" />
      </div>
    </div>
  </section>
</body>
</html>
